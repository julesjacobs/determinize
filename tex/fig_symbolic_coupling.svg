<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850">
  <defs>
    <marker id="arrow-dark" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6.5 L0,13 Z" fill="#263445"/>
    </marker>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6.5 L0,13 Z" fill="#1d4f91"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6.5 L0,13 Z" fill="#21703a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6.5 L0,13 Z" fill="#b25b10"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .subtitle { font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .panel-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .small-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .column-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .body { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .body-bold { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .code { font: 500 21px "SF Mono", Menlo, Consolas, monospace; fill: #1f2937; }
      .code-small { font: 500 18px "SF Mono", Menlo, Consolas, monospace; fill: #1f2937; }
      .math-code { font: 500 24px "STIX Two Math", "STIXGeneral", "Times New Roman", serif; fill: #1f2937; }
      .math-small { font: 500 19px "STIX Two Math", "STIXGeneral", "Times New Roman", serif; fill: #1f2937; }
      .math-body { font: 700 22px "STIX Two Math", "STIXGeneral", "Times New Roman", serif; fill: #a15c07; }
      .math-inline { font-family: "STIX Two Math", "STIXGeneral", "Times New Roman", serif; font-weight: 700; }
      .math-eq { font: 700 24px "STIX Two Math", "STIXGeneral", "Times New Roman", serif; fill: #4c1d95; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263445; }
      .label-small { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263445; }
      .sem-title { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sem-note { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .eq-label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263445; }
      .blue-panel { fill: #f3f8ff; stroke: #1d4f91; stroke-width: 3; }
      .green-panel { fill: #f0fbf3; stroke: #21703a; stroke-width: 3; }
      .amber-panel { fill: #fff7ec; stroke: #d97706; stroke-width: 3; }
      .neutral-panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; }
      .purple-panel { fill: #f5f0ff; stroke: #6941c6; stroke-width: 3; }
      .blue-text { fill: #1d4f91; }
      .green-text { fill: #21703a; }
      .amber-text { fill: #a15c07; }
      .purple-text { fill: #4c1d95; }
      .blue-line { fill: none; stroke: #1d4f91; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #21703a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .amber-line { fill: none; stroke: #b25b10; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .dark-line { fill: none; stroke: #263445; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-dark); }
      .dashed-line { fill: none; stroke: #263445; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 13 12; }
      .dashed-small { fill: none; stroke: #667085; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; }
      .plain-line { fill: none; stroke: #667085; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .badge-e { fill: #dcfae6; stroke: #32d583; stroke-width: 2; }
      .badge-g { fill: #d1e9ff; stroke: #2e90fa; stroke-width: 2; }
      .dist-axis { fill: none; stroke: #98a2b3; stroke-width: 1.6; stroke-linecap: round; }
      .dist-e { fill: none; stroke: #21703a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dist-g { fill: none; stroke: #1d4f91; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dist-fill-e { fill: #dcfae6; opacity: 0.8; }
      .dist-fill-g { fill: #d1e9ff; opacity: 0.8; }
      .point-fill { fill: #21703a; }
      .sample-dot-e { fill: #21703a; opacity: 0.85; }
      .sample-dot-g { fill: #1d4f91; opacity: 0.85; }
      .sample-dot-mix { fill: #263445; opacity: 0.75; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="850"/>
  <text class="title" x="90" y="74">Symbolic coupling proof shape</text>
  <text class="subtitle" x="90" y="110">The symbolic state sits between the original and determinized programs; each lower semantics is reached by two equivalent routes.</text>

  <!-- Top row: three objects at the same vertical level -->
  <g filter="url(#shadow)">
    <rect class="blue-panel" x="40" y="160" width="500" height="240" rx="20"/>
    <rect class="amber-panel" x="590" y="185" width="620" height="260" rx="20"/>
    <rect class="green-panel" x="1260" y="160" width="500" height="240" rx="20"/>
  </g>

  <text class="panel-title blue-text" x="80" y="208">Original program e</text>
  <text class="code" x="80" y="245">u = uniform(0,1)</text>
  <rect class="badge-e" x="350" y="226" width="38" height="25" rx="13"/>
  <text class="label green-text" x="362" y="245">E</text>
  <g transform="translate(405 227)">
    <path class="dist-axis" d="M0,24 H72"/>
    <circle class="sample-dot-e" cx="10" cy="19" r="2.4"/>
    <circle class="sample-dot-e" cx="18" cy="11" r="2.4"/>
    <circle class="sample-dot-e" cx="27" cy="17" r="2.4"/>
    <circle class="sample-dot-e" cx="35" cy="8" r="2.4"/>
    <circle class="sample-dot-e" cx="43" cy="15" r="2.4"/>
    <circle class="sample-dot-e" cx="52" cy="10" r="2.4"/>
    <circle class="sample-dot-e" cx="61" cy="18" r="2.4"/>
  </g>
  <text class="code" x="80" y="278">b = beta(3,2)</text>
  <rect class="badge-g" x="350" y="259" width="38" height="25" rx="13"/>
  <text class="label blue-text" x="361" y="278">G</text>
  <g transform="translate(405 260)">
    <path class="dist-axis" d="M0,24 H72"/>
    <circle class="sample-dot-g" cx="18" cy="18" r="2.4"/>
    <circle class="sample-dot-g" cx="27" cy="11" r="2.4"/>
    <circle class="sample-dot-g" cx="34" cy="8" r="2.4"/>
    <circle class="sample-dot-g" cx="41" cy="10" r="2.4"/>
    <circle class="sample-dot-g" cx="48" cy="14" r="2.4"/>
    <circle class="sample-dot-g" cx="55" cy="19" r="2.4"/>
  </g>
  <text class="code" x="80" y="311">g = gamma(u,b)</text>
  <rect class="badge-e" x="350" y="292" width="38" height="25" rx="13"/>
  <text class="label green-text" x="362" y="311">E</text>
  <g transform="translate(405 293)">
    <path class="dist-axis" d="M0,24 H72"/>
    <circle class="sample-dot-e" cx="9" cy="21" r="2"/>
    <circle class="sample-dot-e" cx="15" cy="13" r="2"/>
    <circle class="sample-dot-e" cx="20" cy="7" r="2"/>
    <circle class="sample-dot-e" cx="27" cy="11" r="2"/>
    <circle class="sample-dot-e" cx="34" cy="9" r="2"/>
    <circle class="sample-dot-e" cx="41" cy="15" r="2"/>
    <circle class="sample-dot-e" cx="48" cy="19" r="2"/>
    <circle class="sample-dot-e" cx="56" cy="21" r="2"/>
    <circle class="sample-dot-e" cx="13" cy="16" r="2"/>
    <circle class="sample-dot-e" cx="22" cy="18" r="2"/>
    <circle class="sample-dot-e" cx="31" cy="14" r="2"/>
    <circle class="sample-dot-e" cx="43" cy="12" r="2"/>
    <circle class="sample-dot-e" cx="54" cy="17" r="2"/>
    <circle class="sample-dot-e" cx="64" cy="22" r="2"/>
  </g>
  <text class="code" x="80" y="344">return 2*g + 1</text>
  <text class="body" x="80" y="378">uniform and gamma are E-mode sites</text>

  <text class="panel-title amber-text" x="630" y="233">Symbolic semantics &#x03C3;</text>
  <text class="label amber-text" x="630" y="268">E-samples symbolic; G-samples step normally</text>
  <rect class="neutral-panel" x="610" y="284" width="580" height="158" rx="12"/>
  <text class="column-title amber-text" x="642" y="310">symbolic samples</text>
  <rect class="badge-e" x="852" y="292" width="38" height="25" rx="13"/>
  <text class="label green-text" x="864" y="311">E</text>
  <path class="plain-line" d="M940,300 L940,380"/>
  <text class="column-title amber-text" x="975" y="310">random samples</text>
  <rect class="badge-g" x="1140" y="292" width="38" height="25" rx="13"/>
  <text class="label blue-text" x="1151" y="311">G</text>
  <text class="code-small" x="642" y="350">u = uniform(0,1)</text>
  <g transform="translate(850 330) scale(1)">
    <path class="dist-axis" d="M0,24 H62"/>
    <path class="dist-fill-e" d="M9,23 V7 H52 V23 Z"/>
    <path class="dist-e" d="M9,23 V7 H52 V23"/>
  </g>
  <text class="code-small" x="642" y="380">g = gamma(u,b)</text>
  <g transform="translate(850 360) scale(1)">
    <path class="dist-axis" d="M0,24 H62"/>
    <path class="dist-fill-e" opacity="0.35" d="M6,23 C11,10 19,4 29,8 C40,12 49,20 59,23 Z"/>
    <path class="dist-fill-e" opacity="0.28" d="M4,23 C10,16 18,10 28,12 C40,14 50,18 60,23 Z"/>
    <path class="dist-fill-e" opacity="0.24" d="M10,23 C15,18 24,12 35,10 C47,9 55,16 61,23 Z"/>
    <path class="dist-e" opacity="0.82" d="M6,23 C11,10 19,4 29,8 C40,12 49,20 59,23"/>
    <path class="dist-e" opacity="0.72" d="M4,23 C10,16 18,10 28,12 C40,14 50,18 60,23"/>
    <path class="dist-e" opacity="0.62" d="M10,23 C15,18 24,12 35,10 C47,9 55,16 61,23"/>
  </g>
  <text class="code-small" x="975" y="350">b = beta(3,2)</text>
  <g transform="translate(1120 326) scale(1.6)">
    <path class="dist-axis" d="M0,22 H38"/>
    <circle class="sample-dot-g" cx="10" cy="18" r="2.7"/>
    <circle class="sample-dot-g" cx="16" cy="11" r="2.7"/>
    <circle class="sample-dot-g" cx="21" cy="8" r="2.7"/>
    <circle class="sample-dot-g" cx="26" cy="10" r="2.7"/>
    <circle class="sample-dot-g" cx="31" cy="14" r="2.7"/>
    <circle class="sample-dot-g" cx="35" cy="18" r="2.7"/>
  </g>
  <path class="plain-line" d="M644,408 L838,408"/>
  <text class="small-title amber-text" x="900" y="414" text-anchor="middle">residual</text>
  <path class="plain-line" d="M962,408 L1156,408"/>
  <text class="code-small" x="900" y="434" text-anchor="middle">return 2*g + 1</text>

  <text class="panel-title green-text" x="1300" y="208">Determinized program D(e)</text>
  <text class="code" x="1300" y="245">u = 0.5</text>
  <g transform="translate(1490 227)">
    <path class="dist-axis" d="M0,24 H72"/>
    <path class="dist-e" d="M36,23 V5"/>
    <circle class="point-fill" cx="36" cy="5" r="4"/>
  </g>
  <text class="code" x="1300" y="278">b = beta(3,2)</text>
  <g transform="translate(1490 260)">
    <path class="dist-axis" d="M0,24 H72"/>
    <circle class="sample-dot-g" cx="18" cy="18" r="2.4"/>
    <circle class="sample-dot-g" cx="27" cy="11" r="2.4"/>
    <circle class="sample-dot-g" cx="34" cy="8" r="2.4"/>
    <circle class="sample-dot-g" cx="41" cy="10" r="2.4"/>
    <circle class="sample-dot-g" cx="48" cy="14" r="2.4"/>
    <circle class="sample-dot-g" cx="55" cy="19" r="2.4"/>
  </g>
  <text class="code" x="1300" y="311">g = u / b</text>
  <g transform="translate(1490 293)">
    <path class="dist-axis" d="M0,24 H72"/>
    <circle class="sample-dot-mix" cx="11" cy="8" r="2.1"/>
    <circle class="sample-dot-mix" cx="18" cy="15" r="2.1"/>
    <circle class="sample-dot-mix" cx="25" cy="11" r="2.1"/>
    <circle class="sample-dot-mix" cx="32" cy="18" r="2.1"/>
    <circle class="sample-dot-mix" cx="39" cy="13" r="2.1"/>
    <circle class="sample-dot-mix" cx="46" cy="20" r="2.1"/>
    <circle class="sample-dot-mix" cx="54" cy="18" r="2.1"/>
    <circle class="sample-dot-mix" cx="62" cy="22" r="2.1"/>
  </g>
  <text class="code" x="1300" y="344">return 2*g + 1</text>
  <text class="body" x="1300" y="378">beta randomness is preserved</text>

  <!-- Lower semantics boxes -->
  <g filter="url(#shadow)">
    <rect class="blue-panel" x="155" y="625" width="515" height="145" rx="20"/>
    <rect class="green-panel" x="1130" y="625" width="515" height="145" rx="20"/>
  </g>
  <text class="sem-title blue-text" x="412.5" y="670" text-anchor="middle">semantics of e</text>
  <text class="math-code" x="412.5" y="710" text-anchor="middle">&#x27E6;e&#x27E7;<tspan baseline-shift="super" font-size="70%">n</tspan></text>
  <text class="sem-note" x="412.5" y="742" text-anchor="middle">distribution of the original program</text>

  <text class="sem-title green-text" x="1387.5" y="670" text-anchor="middle">semantics of D(e)</text>
  <text class="math-code" x="1387.5" y="710" text-anchor="middle">&#x27E6;D(e)&#x27E7;<tspan baseline-shift="super" font-size="70%">n</tspan></text>
  <text class="sem-note" x="1387.5" y="742" text-anchor="middle">semantics of the transformed program</text>

  <!-- Equality of expectations between the two semantics -->
  <path class="dashed-line" d="M670,710 C790,628 1010,628 1130,710"/>
  <text class="math-eq" x="900" y="626" text-anchor="middle">E[e] = E[D(e)]</text>

  <!-- Two incoming arrows into the left semantics -->
  <path class="blue-line" d="M290,401 L290,620"/>
  <rect class="neutral-panel" x="206" y="500" width="168" height="42" rx="12"/>
  <text class="label blue-text" x="290" y="527" text-anchor="middle">apply <tspan class="math-inline">&#x27E6;-&#x27E7;<tspan baseline-shift="super" font-size="70%">n</tspan></tspan> to e</text>

  <path class="amber-line" d="M760,446 C635,505 535,555 455,620"/>
  <rect class="neutral-panel" x="510" y="515" width="260" height="48" rx="14"/>
  <text class="label amber-text" x="640" y="541" text-anchor="middle">sample E-bindings</text>
  <path class="dashed-small" d="M374,521 C397,521 415,527 434,532"/>
  <path class="dashed-small" d="M458,537 C476,539 494,539 510,539"/>
  <rect class="neutral-panel" x="434" y="515" width="24" height="24" rx="8"/>
  <text class="label" x="446" y="533" text-anchor="middle">=</text>
  <path class="dashed-small" d="M770,539 L1035,539"/>
  <text class="label purple-text" x="900" y="518" text-anchor="middle">equal in expectation</text>

  <!-- Two incoming arrows into the right semantics -->
  <path class="green-line" d="M1530,401 L1530,620"/>
  <rect class="neutral-panel" x="1432" y="500" width="196" height="42" rx="12"/>
  <text class="label green-text" x="1530" y="527" text-anchor="middle">apply <tspan class="math-inline">&#x27E6;-&#x27E7;<tspan baseline-shift="super" font-size="70%">n</tspan></tspan> to D(e)</text>

  <path class="amber-line" d="M1040,446 C1165,505 1265,555 1345,620"/>
  <rect class="neutral-panel" x="1035" y="515" width="290" height="48" rx="14"/>
  <text class="label amber-text" x="1180" y="541" text-anchor="middle">replace E-bindings by means</text>
  <path class="dashed-small" d="M1325,539 C1331,539 1337,534 1343,529"/>
  <path class="dashed-small" d="M1367,521 C1388,521 1410,521 1432,521"/>
  <rect class="neutral-panel" x="1343" y="515" width="24" height="24" rx="8"/>
  <text class="label" x="1355" y="533" text-anchor="middle">=</text>

</svg>
