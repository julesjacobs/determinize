# Builds and tests the Lean development on pull requests. On main, pages.yml runs this workflow
# and then builds the API documentation from the build it saved.
#
# Every `run` step executes inside the flake's `lean` dev shell, so elan, git, curl, Python and
# the C compiler are the versions flake.lock pins. Lean and Mathlib are pinned by
# lean/lean-toolchain and lean/lake-manifest.json, doc-gen4 by lean/docbuild/lake-manifest.json.
name: Lean

on:
  pull_request:
    # The files that the build, the tests and the scripts they start read. The workflows are read
    # by the trigger test in tests/test_workflows.py.
    paths:
      - lean/**
      - "!lean/**/*.md"
      - tests/**
      - "!tests/**/*.md"
      - examples/**
      - run.sh
      - tools/storm*.py
      - flake.nix
      - flake.lock
      - flake-modules/systems.nix
      - flake-modules/devshells/lean.nix
      - .github/workflows/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop .#lean --command bash -euo pipefail {0}
    working-directory: lean

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # lean/docbuild keeps its dependencies in lean/.lake/packages too, so a revision it pins
      # differently would be checked out over the one the main build uses.
      - name: Check that lean/docbuild pins the same toolchain and dependencies
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          def revisions(path):
              return {p["name"]: p["rev"] for p in json.load(open(path))["packages"] if "rev" in p}
          main, docs = revisions("lake-manifest.json"), revisions("docbuild/lake-manifest.json")
          stale = sorted(name for name in main if docs.get(name) != main[name])
          toolchain, docs_toolchain = (pathlib.Path(p).read_text().strip()
                                       for p in ("lean-toolchain", "docbuild/lean-toolchain"))
          if toolchain != docs_toolchain:
              stale.insert(0, f"Lean ({docs_toolchain} instead of {toolchain})")
          if stale:
              sys.exit("lean/docbuild is out of date for: " + ", ".join(stale) + ".\n"
                       "Set doc-gen4's `rev` in lean/docbuild/lakefile.toml to the Lean version, then "
                       "run `MATHLIB_NO_CACHE_ON_UPDATE=1 lake update` in lean/docbuild.")
          EOF
      # This repository's own build outputs (about 1 GB) are kept in the Actions cache. Mathlib's
      # prebuilt files (8 GB) are downloaded by `lake exe cache get` instead. The executables load
      # the glibc of the dev shell by its store path, and Lake does not relink them when it
      # changes, so the key includes flake.lock.
      - name: Restore the previous build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-${{ github.sha }}
          restore-keys: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-
      # Lake clones each dependency with its full history, which takes over three minutes for
      # Mathlib, so the checkouts, without their build directories, are kept once per set of pins.
      - name: Restore the sources of the dependencies
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/*/*
            !lean/.lake/packages/*/.lake
          key: lean-sources-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      # Linking the executables needs the object files of every module they import. Mathlib's cache
      # does not provide them, and compiling them takes about 11 minutes, so they are kept in the
      # Actions cache (about 250 MB) once per set of pins.
      - name: Restore the object files of the dependencies
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages/*/.lake/build/ir/**/*.c.o*
          key: lean-objects-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # Fails on any warning (a `sorry` included), on a theorem using a non-standard axiom, and on
      # a statement in Theorems.lean relying on Proof for anything but proofs.
      - name: Build
        run: lake build --wfail
      - name: Save the build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-${{ github.sha }}
      - name: Save the object files of the dependencies
        if: github.event_name != 'pull_request' && steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages/*/.lake/build/ir/**/*.c.o*
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Save the sources of the dependencies
        if: github.event_name != 'pull_request' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/*/*
            !lean/.lake/packages/*/.lake
          key: ${{ steps.sources.outputs.cache-primary-key }}
      - name: Test
        run: ./test.sh --all
