# Checks the simulator's formatting and lint with Biome and its types with TypeScript, runs its
# tests, builds it into sim/dist/ and uploads that directory as the `simulator` artifact. On main,
# pages.yml runs this workflow and publishes the artifact.
#
# Every `run` step executes inside the flake's `sim` dev shell, so Node.js, npm and Biome are the
# versions flake.lock pins. The shell also links sim/node_modules, which Nix builds from
# sim/package-lock.json.
name: Simulator

on:
  pull_request:
    # The files that the checks, the tests and the build read.
    paths:
      - sim/**
      - tests/**
      - "!tests/**/*.md"
      - examples/**
      - flake.nix
      - flake.lock
      - flake-modules/systems.nix
      - flake-modules/devshells/sim.nix
      - .github/workflows/sim.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop .#sim --command bash -euo pipefail {0}
    working-directory: sim

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check formatting and lint
        run: biome ci .
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload the simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator
          path: sim/dist/
          if-no-files-found: error
          retention-days: 1
