# Tests the simulator on pull requests and on main, and checks that the committed bundle is the
# one its sources build: sim/index.html loads sim/app.bundle.js, so a change to the sources is
# committed together with the rebuilt bundle.
#
# Every `run` step executes inside the flake's `sim` dev shell, so Node.js, npm and git are the
# versions flake.lock pins. The npm packages, esbuild among them, are pinned by
# sim/package-lock.json.
name: Simulator

on:
  push:
    branches: [main]
    paths: &sim-paths
      - sim/**
      - flake.nix
      - flake.lock
      - flake-modules/**
      - .github/workflows/sim.yml
  pull_request:
    paths: *sim-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop .#sim --command bash -euo pipefail {0}
    working-directory: sim

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install the dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check that the committed bundle is up to date
        run: |
          if ! git diff --quiet -- app.bundle.js; then
            echo "::error file=sim/app.bundle.js::The bundle is out of date. Run 'npm run build' in sim and commit app.bundle.js."
            exit 1
          fi
