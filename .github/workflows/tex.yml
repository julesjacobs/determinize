# Builds the paper, tex/main.pdf, on pull requests and on main, and uploads it as an artifact of
# the run. The build fails on a LaTeX error, an unresolved reference or citation, a multiply
# defined label, and a character missing from its font.
#
# Every `run` step executes inside the flake's `tex` dev shell, so TeX Live and latexmk are the
# versions flake.lock pins. acmart.cls and ACM-Reference-Format.bst are committed in tex/.
name: Paper

on:
  # Both filters list the files that the build reads.
  push:
    branches: [main]
    paths:
      - tex/**
      - "!tex/archive/**"
      - "!tex/**/*.md"
      - results/**
      - flake.nix
      - flake.lock
      - flake-modules/systems.nix
      - flake-modules/devshells/tex.nix
      - .github/workflows/tex.yml
  pull_request:
    paths:
      - tex/**
      - "!tex/archive/**"
      - "!tex/**/*.md"
      - results/**
      - flake.nix
      - flake.lock
      - flake-modules/systems.nix
      - flake-modules/devshells/tex.nix
      - .github/workflows/tex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tex-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop .#tex --command bash -euo pipefail {0}
    working-directory: tex

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -Werror main.tex
      - name: Upload the paper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper
          path: tex/main.pdf
          if-no-files-found: error
