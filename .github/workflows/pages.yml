# Publishes the simulator and the API documentation of the Lean development from main to GitHub
# Pages, once lean.yml and sim.yml pass on the same commit. The simulator is the front page of the
# site and the documentation is under docs/.
#
# GitHub Pages serves one site per repository and each deployment replaces all of it, so both
# parts are built and published together when either of them changes.
name: Pages

on:
  push:
    branches: [main]
    # Those of lean.yml and sim.yml.
    paths:
      - lean/**
      - tests/**
      - examples/**
      - tools/**
      - "*.sh"
      - sim/**
      - flake.nix
      - flake.lock
      - flake-modules/**
      - .github/workflows/lean.yml
      - .github/workflows/sim.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A deployment that has started is left to finish. Of the runs waiting behind it, only the latest
# is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lean:
    name: Lean
    uses: $/.github/workflows/lean.yml

  sim:
    name: Simulator
    uses: $/.github/workflows/sim.yml

  build:
    name: Build the site
    needs: [lean, sim]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: nix develop .#lean --command bash -euo pipefail {0}
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Restore this commit's build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      # Documenting Lean and the imported part of Mathlib takes about two CPU-hours, so that work
      # is saved once per set of pins. Starting from it, only this repository's modules are
      # redone. Pages of modules deleted since it was saved stay in the published site, unlinked.
      - name: Restore the documentation of the dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/docbuild/.lake/build
          key: lean-docs-${{ hashFiles('lean/lean-toolchain', 'lean/docbuild/lake-manifest.json') }}
      # Saved by lean.yml.
      - name: Restore the sources of the dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/*/*
            !lean/.lake/packages/*/.lake
          key: lean-sources-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      # Lake starts git and doc-gen4 with fork(). Documenting the dependencies, Lake runs over a
      # hundred threads whose stacks merge into one mapping larger than RAM and swap together, so
      # the kernel's default heuristic overcommit refuses every fork although memory is free and
      # the build fails with "resource exhausted (error code: 12, cannot allocate memory)".
      - name: Allow memory overcommit
        shell: bash
        run: sudo sysctl -w vm.overcommit_memory=1
      # doc-gen4 marks each documented module with an empty file, so Lake does not notice when a
      # module's documentation changes and would keep the restored pages. Removing the marker of
      # the rendering step renders every page again from the database.
      - name: Build the documentation
        working-directory: lean/docbuild
        run: |
          rm -f .lake/build/doc-data/*.docs_built*
          lake build Determinize:docs
      - name: Download the simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulator
          path: _site
      # Copied, not moved: when the documentation of the dependencies was not restored, it is
      # saved from lean/docbuild/.lake/build at the end of the job. doc-gen4's index.html is a
      # placeholder, so docs/ redirects to the root module's page.
      - name: Add the documentation under docs/
        run: |
          cp -R docbuild/.lake/build/doc ../_site/docs
          cat > ../_site/docs/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Determinize</title>
          <link rel="canonical" href="Determinize.html">
          <meta http-equiv="refresh" content="0; url=Determinize.html">
          <a href="Determinize.html">Determinize</a>
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy the site
      id-token: write # to prove to Pages that the deployment comes from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
