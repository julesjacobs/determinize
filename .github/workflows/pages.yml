# Publishes the site from main to GitHub Pages: the landing page from site/ at the root, the
# simulator under sim/, the API documentation of the Lean development under docs/ and the paper as
# determinize.pdf. site/assemble.sh puts them together.
#
# GitHub Pages serves one site per repository and each deployment replaces all of it, so every
# deployment publishes every part, once sim.yml, tex.yml, site.yml and lean.yml have passed on the
# same inputs and the links of the landing page and the simulator resolve in the assembled site.
# The landing page, the simulator and the paper are built every time. lean.yml is skipped when its
# inputs passed it before on main, and the documentation, built while lean.yml runs, is restored
# when the same sources were rendered before. A manual run redoes both.
name: Pages

on:
  push:
    branches: [main]
    # The union of the pull-request filters of the workflows it runs, which cover this file too;
    # tests/test_workflows.py checks it.
    paths:
      - lean/**
      - "!lean/**/*.md"
      - tests/**
      - "!tests/**/*.md"
      - examples/**
      - run.sh
      - tools/storm*.py
      - sim/**
      - site/**
      - tex/**
      - "!tex/archive/**"
      - "!tex/**/*.md"
      - results/**
      - flake.nix
      - flake.lock
      - flake-modules/systems.nix
      - flake-modules/devshells/lean.nix
      - flake-modules/devshells/sim.nix
      - flake-modules/devshells/site.nix
      - flake-modules/devshells/tex.nix
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

# A deployment that has started is left to finish. Of the runs waiting behind it, only the latest
# is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Looks up earlier results by the content of their inputs rather than by the commits of a push,
  # which brings several at once after a rebase merge.
  changes:
    name: Look up earlier results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lean: ${{ steps.inputs.outputs.lean }}
      docs: ${{ steps.inputs.outputs.docs }}
      tested: ${{ steps.tested.outputs.cache-hit == 'true' }}
      rendered: ${{ steps.rendered.outputs.cache-matched-key != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lean: the files of lean.yml's pull-request filter, which tests/test_workflows.py checks.
      # docs: the sources and pins that the documentation is built from, and this workflow.
      - name: Hash the inputs
        id: inputs
        run: |
          echo "lean=${{ hashFiles('lean/**', '!lean/**/*.md', 'tests/**', '!tests/**/*.md', 'examples/**', 'run.sh', 'tools/storm*.py', 'flake.nix', 'flake.lock', 'flake-modules/systems.nix', 'flake-modules/devshells/lean.nix', '.github/workflows/**') }}" >> "$GITHUB_OUTPUT"
          echo "docs=${{ hashFiles('lean/Determinize.lean', 'lean/Determinize/**/*.lean', 'lean/lakefile.toml', 'lean/lake-manifest.json', 'lean/lean-toolchain', 'lean/docbuild/**', 'flake.lock', '.github/workflows/pages.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Look up a passing run of the Lean tests
        id: tested
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean-tested
          key: lean-tested-${{ steps.inputs.outputs.lean }}
          lookup-only: true
      - name: Look up the rendered documentation
        id: rendered
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/docs
          key: lean-html-${{ steps.inputs.outputs.docs }}-${{ github.run_id }}
          restore-keys: lean-html-${{ steps.inputs.outputs.docs }}-
          lookup-only: true
      # When lean and docs are skipped, nothing else reads the entries below, and GitHub evicts an
      # entry after seven days without access. A lookup sends the same request as a restore, so
      # every run looks them up, with the paths of the steps that save them.
      - name: Keep the newest Lean build cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-${{ github.sha }}
          restore-keys: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-
          lookup-only: true
      - name: Keep the sources of the dependencies cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/*/*
            !lean/.lake/packages/*/.lake
          key: lean-sources-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
          lookup-only: true
      - name: Keep the object files of the dependencies cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages/*/.lake/build/ir/**/*.c.o*
          key: lean-objects-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
          lookup-only: true
      - name: Keep doc-gen4 and the documentation of the dependencies cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/doc-gen4
            lean/.lake/packages/leansqlite
            lean/.lake/packages/Cli
            lean/.lake/packages/UnicodeBasic
            lean/.lake/packages/BibtexQuery
            lean/.lake/packages/MD4Lean
            lean/docbuild/.lake/build/api-docs.db
            lean/docbuild/.lake/build/doc-data/*
            !lean/docbuild/.lake/build/doc-data/Determinize*
            lean/docbuild/.lake/build/doc/*
            !lean/docbuild/.lake/build/doc/Determinize*
          key: lean-docs-${{ hashFiles('lean/lean-toolchain', 'lean/docbuild/lake-manifest.json', 'flake.lock') }}
          lookup-only: true

  lean:
    name: Lean
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tested != 'true'
    uses: $/.github/workflows/lean.yml

  # An empty entry whose key records that the Lean inputs passed.
  tested:
    name: Record the passing Lean tests
    needs: [changes, lean]
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: touch lean-tested
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean-tested
          key: lean-tested-${{ needs.changes.outputs.lean }}

  sim:
    name: Simulator
    uses: $/.github/workflows/sim.yml

  paper:
    name: Paper
    uses: $/.github/workflows/tex.yml

  site:
    name: Site
    uses: $/.github/workflows/site.yml

  # Runs alongside the Lean tests. It starts from the newest build that lean.yml saved and lets
  # Lake bring it up to date, and it saves no build itself.
  docs:
    name: Documentation
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.rendered != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: nix develop .#lean --command bash -euo pipefail {0}
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Restore the newest build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-${{ github.sha }}
          restore-keys: lean-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'flake.lock') }}-
      # Saved by lean.yml.
      - name: Restore the sources of the dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/*/*
            !lean/.lake/packages/*/.lake
          key: lean-sources-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # Documenting Lean and the imported part of Mathlib takes about two CPU-hours, so that work
      # is saved together with doc-gen4 and the packages it adds, with their builds. Starting from
      # it, only this repository's modules are redone. Lake redoes all of it whenever the hash of
      # the doc-gen4 executable changes, and that executable loads the glibc of flake.lock (see
      # lean.yml), so the entry is kept once per doc-gen4 pin and flake.lock. It holds the
      # analysis (api-docs.db and the markers in doc-data) and doc/, where rendering expects the
      # files of the earlier steps, but not this repository's pages and markers: doc-gen4 links
      # every page it finds in doc/, so the pages of a deleted module would reappear.
      - name: Restore doc-gen4 and the documentation of the dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lean/.lake/packages/doc-gen4
            lean/.lake/packages/leansqlite
            lean/.lake/packages/Cli
            lean/.lake/packages/UnicodeBasic
            lean/.lake/packages/BibtexQuery
            lean/.lake/packages/MD4Lean
            lean/docbuild/.lake/build/api-docs.db
            lean/docbuild/.lake/build/doc-data/*
            !lean/docbuild/.lake/build/doc-data/Determinize*
            lean/docbuild/.lake/build/doc/*
            !lean/docbuild/.lake/build/doc/Determinize*
          key: lean-docs-${{ hashFiles('lean/lean-toolchain', 'lean/docbuild/lake-manifest.json', 'flake.lock') }}
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      # Lake starts git and doc-gen4 with fork(). Documenting the dependencies, Lake runs over a
      # hundred threads whose stacks merge into one mapping larger than RAM and swap together, so
      # the kernel's default heuristic overcommit refuses every fork although memory is free and
      # the build fails with "resource exhausted (error code: 12, cannot allocate memory)".
      - name: Allow memory overcommit
        shell: bash
        run: sudo sysctl -w vm.overcommit_memory=1
      # doc-gen4 marks each rendering with an empty file, so Lake does not notice when a module's
      # documentation changes and would keep the pages of an earlier run. Removing the markers of
      # the rendering step renders every page again from the database.
      - name: Build the documentation
        working-directory: lean/docbuild
        run: |
          rm -f .lake/build/doc-data/*.docs_built*
          lake build Determinize:docs
      # Copied, not moved: when the documentation of the dependencies was not restored, it is
      # saved from lean/docbuild/.lake/build at the end of the job.
      - name: Collect the documentation
        run: |
          mkdir ../_site
          cp -R docbuild/.lake/build/doc ../_site/docs
      # Each rendering gets its own key, so the newest one of the same sources is restored, and a
      # manual run replaces it.
      - name: Save the documentation
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/docs
          key: lean-html-${{ needs.changes.outputs.docs }}-${{ github.run_id }}

  # Runs when no job before it failed; lean and docs are skipped when their results exist.
  build:
    name: Build the site
    needs: [changes, lean, sim, paper, site, docs]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the documentation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/docs
          key: lean-html-${{ needs.changes.outputs.docs }}-${{ github.run_id }}
          restore-keys: lean-html-${{ needs.changes.outputs.docs }}-
          fail-on-cache-miss: true
      - name: Download the simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulator
          path: _simulator
      - name: Download the paper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper
          path: _paper
      # Under _pages/determinize/, as the site is served, so that the links from its root resolve.
      - name: Assemble the site
        run: |
          site/assemble.sh --out _pages/determinize --sim _simulator --docs _site/docs \
            --paper _paper/main.pdf
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Links to the canonical host are checked as files of the assembled site, and relative
      # ones as they are; anchors and links in code included. Other hosts are not contacted.
      - name: Check the links of the landing page and the simulator
        shell: nix develop .#site --command bash -euo pipefail {0}
        run: |
          lychee --offline --no-progress --include-verbatim --include-fragments --root-dir "$PWD/_pages" \
            --remap "^https://julesjacobs\.com/determinize/ file://$PWD/_pages/determinize/" \
            _pages/determinize/*.html _pages/determinize/sim/*.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages/determinize

  # Without a status function, the condition would also require that no earlier job was skipped.
  deploy:
    name: Publish the site
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy the site
      id-token: write # to prove to Pages that the deployment comes from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
