# API documentation for the Lean development, generated by doc-gen4.
# From this directory: lake build Determinize:docs
# The pages land in .lake/build/doc; serve them over HTTP to browse them.
# doc-gen4 only works with the Lean release it was tagged for, so `rev` follows ../lean-toolchain.
name = "docbuild"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.34.1"

[[require]]
name = "determinize"
path = "../"
